<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aluno — Submissões</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <a href="index.html" class="link">← Voltar à lista</a>
      <section class="card">
        <h1 id="student-name">Aluno</h1>
        <p><a id="student-github" href="#" target="_blank" rel="noopener" class="link">Repositório</a></p>

        <section style="margin-top:12px;padding:12px;border-radius:8px;background:#fbfdff;border:1px solid #eef6ff">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div style="flex:1;min-width:220px">
              <label style="font-size:13px;margin-bottom:6px;display:block">Nome</label>
              <input id="profile-name" type="text" placeholder="Nome do aluno" />
            </div>
            <div style="flex:1;min-width:260px">
              <label style="font-size:13px;margin-bottom:6px;display:block">GitHub (URL)</label>
              <input id="profile-github" type="url" placeholder="https://github.com/usuario/repo" />
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <button id="save-profile" type="button">Salvar perfil</button>
              <button id="reset-profile" type="button" class="secondary">Restaurar</button>
            </div>
          </div>
        </section>

        <form id="status-form">
          <div class="meta">
            <div id="last-saved" class="muted">Último salvo: nunca</div>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
              <button id="toggle-history" type="button" class="secondary" style="padding:6px 10px;font-size:13px">Ver histórico</button>
              <button id="clear-history" type="button" class="secondary" style="padding:6px 10px;font-size:13px">Limpar histórico</button>
            </div>
            <div id="history-area" style="margin-top:12px;display:none"></div>
          </div>
          <fieldset>
            <legend>Tarefas</legend>
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)">
              <div style="width:60px;text-align:center">Pode revisar</div>
              <div style="flex:1;font-weight:600">Tarefa</div>
              <div style="width:160px;text-align:center">Status</div>
              <div style="width:200px;text-align:center">Revisor</div>
            </div>
            <div id="assignments-list" class="tasks-checks"></div>
          </fieldset>

          <div class="actions">
            <button id="save-btn" type="button">Salvar</button>
            <button id="clear-btn" type="button" class="secondary">Limpar</button>
        <button id="issue-btn" type="button" class="secondary">Registrar no GitHub</button>
        <button id="propose-pr-btn" class="btn">Propor alteração (PR)</button>
          </div>
        </form>

      </section>
    </main>
    <script src="student.js"></script>
  </body>
</html>
