<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submissões - Disciplina Python Básico</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <h1>Registrar submissão de tarefa</h1>

      <section class="card grid">
        <aside class="students">
          <h2>Alunos</h2>
          <ul id="students-list" class="students-list"></ul>
        </aside>

        <div class="panel" id="student-panel" aria-hidden="true">
          <button id="close-panel" class="close">×</button>
          <div class="panel-content">
            <h2 id="panel-name">Aluno</h2>
            <p><a id="panel-github" href="#" target="_blank" rel="noopener" class="link">Ver repositório</a></p>

            <form id="panel-form">
              <fieldset>
                <legend>Marcar tarefas que o aluno enviou</legend>
                <div id="tasks-checks" class="tasks-checks"></div>
              </fieldset>

              <div class="actions">
                <button id="panel-open-issues" type="button">Abrir Issues para selecionadas</button>
                <button id="panel-copy" type="button" class="secondary">Copiar resumo (Markdown)</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <footer>
        <p>Repositório: <code>Laboratorio-de-Analise-de-Dados/disciplina_python_basico</code></p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
