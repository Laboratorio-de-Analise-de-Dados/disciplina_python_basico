<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submissões - Disciplina Python Básico</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <div class="brand">
          <strong>Monitoria</strong>
          <small>Disciplina Python Básico</small>
        </div>
        <div class="actions-top">
          <button id="export-btn" class="secondary">Exportar CSV</button>
          <button id="export-reviewers-btn" class="secondary">Exportar 'Pode revisar'</button>
        </div>
      </div>
    </header>

    <main class="container">
      <h1>Registrar submissão de tarefa</h1>

      <section class="card">
        <div class="search-area">
          <input id="search" class="search big" placeholder="Buscar aluno por nome..." aria-label="Buscar aluno">
        </div>

        <div id="students-grid" class="students-grid" aria-live="polite"></div>
      </section>

      <footer>
        <p>Repositório: <code>Laboratorio-de-Analise-de-Dados/disciplina_python_basico</code></p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
